name: Build Xilinx QDMA Windows Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone Xilinx dma_ip_drivers
        shell: pwsh
        run: |
          git clone https://github.com/Xilinx/dma_ip_drivers.git dma_ip_drivers
          cd dma_ip_drivers
          git fetch origin pull/374/head:pr374
          git checkout pr374

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: dma_ip_drivers/QDMA/windows
        run: |
          nuget restore QDMA.sln -PackagesDirectory packages

      - name: Locate WDK tools and add them to PATH
        shell: pwsh
        run: |
          $searchRoots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:GITHUB_WORKSPACE\dma_ip_drivers\QDMA\windows\packages"
          )

          Write-Host "Searching for stampinf.exe..."

          $all = @()
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $all += Get-ChildItem -Path $root -Filter stampinf.exe -Recurse -ErrorAction SilentlyContinue
            }
          }

          if (-not $all -or $all.Count -eq 0) {
            Write-Host "WDK bin tree:"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 200 FullName
            throw "stampinf.exe not found"
          }

          $all | ForEach-Object { Write-Host "Found: $($_.FullName)" }

          # Prefer an x64 WDK tool directory.
          $stamp = $all |
            Where-Object { $_.DirectoryName -match '\\x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $stamp) {
            $stamp = $all | Sort-Object FullName -Descending | Select-Object -First 1
          }

          $wdkToolDir = $stamp.DirectoryName

          Write-Host "Using WDK tool directory: $wdkToolDir"
          Write-Host "stampinf.exe = $($stamp.FullName)"

          # Make WDK tools visible to all subsequent GitHub Actions steps.
          $wdkToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Also expose it in this diagnostic step.
          $env:PATH = "$wdkToolDir;$env:PATH"

          & stampinf.exe /?
          Write-Host "stampinf.exe is now callable."

          # Print other packaging tools if present.
          foreach ($tool in @("inf2cat.exe", "signtool.exe")) {
            $found = Get-ChildItem -Path (Split-Path $wdkToolDir -Parent) -Filter $tool -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              Write-Host "$tool = $($found.FullName)"
            } else {
              Write-Host "WARNING: $tool not found near selected WDK tools."
            }
          }

      - name: Verify build environment
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          Get-Command msbuild | Format-List Source

          Write-Host "StampInf:"
          Get-Command stampinf.exe | Format-List Source

          Write-Host "PATH:"
          $env:PATH

      - name: Build QDMA x64 Release
        shell: pwsh
        working-directory: dma_ip_drivers/QDMA/windows
        run: |
          msbuild QDMA.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Show build outputs
        shell: pwsh
        run: |
          if (Test-Path "dma_ip_drivers/QDMA/windows/build/x64/Release") {
            Get-ChildItem -Recurse "dma_ip_drivers/QDMA/windows/build/x64/Release" |
              Select-Object FullName, Length
          } else {
            Write-Host "Release output directory not found."
          }

      - name: Collect driver and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null

          $release = "dma_ip_drivers/QDMA/windows/build/x64/Release"
          if (!(Test-Path $release)) {
            throw "Release output directory not found: $release"
          }

          Copy-Item "$release\*" "artifact\" -Recurse -Force

          Write-Host "Collected artifact:"
          Get-ChildItem -Recurse artifact | Select-Object FullName, Length

      - name: Upload QDMA Windows package
        uses: actions/upload-artifact@v4
        with:
          name: qdma-windows-x64-release
          path: artifact/**
          if-no-files-found: error
          retention-days: 14
