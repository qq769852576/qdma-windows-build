name: Build Xilinx QDMA Windows Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone Xilinx dma_ip_drivers
        shell: pwsh
        run: |
          git clone https://github.com/Xilinx/dma_ip_drivers.git dma_ip_drivers
          cd dma_ip_drivers
          git fetch origin pull/374/head:pr374
          git checkout pr374

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: dma_ip_drivers/QDMA/windows
        run: |
          nuget restore QDMA.sln -PackagesDirectory packages

      - name: Configure WDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:GITHUB_WORKSPACE\dma_ip_drivers\QDMA\windows\packages"
          )

          function Find-Tool([string]$name) {
            $hits = @()
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $hits += Get-ChildItem -Path $root -Filter $name -Recurse -File -ErrorAction SilentlyContinue
              }
            }
            return $hits
          }

          $stampHits = @(Find-Tool "stampinf.exe")
          if ($stampHits.Count -eq 0) {
            throw "stampinf.exe not found"
          }

          Write-Host "stampinf.exe candidates:"
          $stampHits | ForEach-Object { Write-Host "  $($_.FullName)" }

          # Prefer the normal Windows Kits x64 installation over the NuGet copy.
          $stamp = $stampHits |
            Where-Object {
              $_.FullName -like "*Windows Kits\10\bin*" -and
              $_.DirectoryName -match '\\x64$'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $stamp) {
            $stamp = $stampHits |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $stamp) {
            $stamp = $stampHits | Select-Object -First 1
          }

          Write-Host "Selected stampinf.exe:"
          Write-Host "  $($stamp.FullName)"

          $toolDirs = New-Object System.Collections.Generic.List[string]
          $toolDirs.Add($stamp.DirectoryName)

          foreach ($toolName in @("inf2cat.exe", "signtool.exe")) {
            $hits = @(Find-Tool $toolName)

            if ($hits.Count -eq 0) {
              Write-Host "WARNING: $toolName not found"
              continue
            }

            $selected = $hits |
              Where-Object {
                $_.FullName -like "*Windows Kits\10\bin*" -and
                $_.DirectoryName -match '\\x64$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $selected) {
              $selected = $hits |
                Where-Object { $_.DirectoryName -match '\\x64$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }

            if (-not $selected) {
              $selected = $hits | Select-Object -First 1
            }

            Write-Host "$toolName = $($selected.FullName)"
            $toolDirs.Add($selected.DirectoryName)
          }

          $toolDirs = $toolDirs | Select-Object -Unique

          Write-Host ""
          Write-Host "Adding WDK/SDK tool directories to PATH:"
          foreach ($dir in $toolDirs) {
            Write-Host "  $dir"
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          # Do NOT run "stampinf.exe /?" here:
          # StampInf prints help but may return exit code 1, causing the Action
          # step to fail even though the executable exists.
          Write-Host ""
          Write-Host "WDK tool discovery PASS"

      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "MSBuild:"
          (Get-Command msbuild).Source

          Write-Host "stampinf.exe:"
          (Get-Command stampinf.exe).Source

          $inf2cat = Get-Command inf2cat.exe -ErrorAction SilentlyContinue
          if ($inf2cat) {
            Write-Host "inf2cat.exe:"
            $inf2cat.Source
          } else {
            Write-Host "WARNING: inf2cat.exe is not on PATH"
          }

          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) {
            Write-Host "signtool.exe:"
            $signtool.Source
          } else {
            Write-Host "WARNING: signtool.exe is not on PATH"
          }

          Write-Host "Build environment verification PASS"

      - name: Build QDMA x64 Release
        shell: pwsh
        working-directory: dma_ip_drivers/QDMA/windows
        run: |
          $ErrorActionPreference = "Stop"
          msbuild QDMA.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Show build outputs
        shell: pwsh
        run: |
          $release = "dma_ip_drivers/QDMA/windows/build/x64/Release"
          if (!(Test-Path $release)) {
            throw "Release output directory not found: $release"
          }

          Get-ChildItem -Recurse $release |
            Select-Object FullName, Length

      - name: Collect driver and tools
        shell: pwsh
        run: |
          $release = "dma_ip_drivers/QDMA/windows/build/x64/Release"
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "$release\*" "artifact\" -Recurse -Force

          Write-Host "Collected files:"
          Get-ChildItem -Recurse artifact |
            Select-Object FullName, Length

      - name: Upload QDMA Windows package
        uses: actions/upload-artifact@v4
        with:
          name: qdma-windows-x64-release
          path: artifact/**
          if-no-files-found: error
          retention-days: 14
